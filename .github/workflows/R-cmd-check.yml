name: R-CMD-check
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: true
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      
      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: '*'
          failOnError: false
      
      - name: Clear R package cache (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf ~/.cache/R
          rm -rf ~/.local/share/renv
          rm -rf ~/Library/Caches/org.R-project.R
      
      - name: Install FFTW (Windows)
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\vcpkg.exe install fftw3:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $GITHUB_ENV
        shell: bash
      
      - name: Install FFTW (macOS)
        if: runner.os == 'macOS'
        run: brew install fftw
      
      - name: Install FFTW (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev
      
      - uses: r-lib/actions/setup-pandoc@v2
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: false
          extra-repositories: 'https://cloud.r-project.org'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ runner.os == 'Windows' && 'stable-x86_64-pc-windows-gnu' || 'stable' }}
      
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: devel
          upgrade: "TRUE"
          extra-packages: |
            any::rcmdcheck
            any::rmarkdown
            any::knitr
            any::rextendr
          needs: check
      
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev
      
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual","--no-build-vignettes")'
          args: 'c("--no-manual", "--no-vignettes")'
          error-on: '"error"'
          upload-results: 'true'
          artifact-name: 'results-${{ matrix.config.os }}-r${{ matrix.config.r }}'
          upload-snapshots: 'true'