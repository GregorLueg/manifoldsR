url: https://gregorlueg.github.io/manifoldsR/

template:
  bootstrap: 5
  bootswatch: darkly
  bslib:
    primary: "#00bc8c"
    border-radius: 0.4rem
    btn-border-radius: 0.4rem
  includes:
    in_header: ""
  css: pkgdown/extra.css

home:
  title: "manifoldsR"
  description: "Fast(!) manifold embedding learning methods powered by Rust"

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://gregorlueg.github.io/manifoldsR/
      aria-label: GitHub

articles:
  - title: "Vignettes"
    navbar: ~
    contents:
      - knn_searches
      - umap
      - tsne

reference:
  - title: "Main functions"
    desc: "The core functions to generate the embeddings"
    contents:
      - tsne
      - umap
  - title: "kNN helpers"
    desc: "Everything and anything around kNN graph generation"
    contents:
      - generate_knn_graph
      - generate_nearest_neigbours_class
      - get_idx_mat
      - get_idx_flat
      - get_dist_mat
      - get_dist_flat
  - title: "Synthetic data"
    contents:
      - manifold_synthetic_data
  - title: "Params"
    desc: "Wrapper functions around core parameters"
    contents:
      - params_nn
      - params_umap
      - params_tsne
  - title: "Rust wrappers"
    desc: "Everything rusty - only use this if you know what you are doing..."
    contents:
      - rs_approx_nearest_neighbours
      - rs_data_clusters
      - rs_data_swiss_role
      - rs_data_trajectory
      - rs_tsne
      - rs_tsne_from_knn
      - rs_umap
      - rs_umap_from_knn
      - rs_check_cluster_separation
  - title: "Internal"
    desc: "Internal helper functions"
    contents:
      - checkCellTrajectories
      - checkNnParams
      - checkUmapParams
      - checkTsneParams
      - assertCellTrajectories
      - assertNnParams
      - assertUmapParams
      - assertTsneParams
