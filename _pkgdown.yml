url: https://gregorlueg.github.io/manifoldsR/
template:
  bootstrap: 5
  bootswatch: solar
  bslib:
    primary: "#268bd2"
    border-radius: 0.4rem
    btn-border-radius: 0.4rem
  includes:
    in_header: ""
  css: pkgdown/extra.css
home:
  title: "manifoldsR"
  description: "Fast(!) manifold embedding learning methods powered by Rust"
navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/GregorLueg/manifoldsR
      aria-label: GitHub

articles:
  - title: "Vignettes"
    navbar: ~
    contents:
      - knn_searches
      - umap
      - tsne
      - phate
      - pacmap

reference:
  - title: "Main functions"
    desc: "The core functions to generate the 2D embeddings"
    contents:
      - tsne
      - umap
      - phate
      - pacmap
  - title: "kNN helpers"
    desc: "Everything and anything around kNN graph generation"
    contents:
      - generate_knn_graph
      - generate_nearest_neigbours_class
      - get_idx_mat
      - get_idx_flat
      - get_dist_mat
      - get_dist_flat
  - title: "Synthetic data"
    contents:
      - manifold_synthetic_data
  - title: "Params"
    desc: "Wrapper functions around core parameters"
    contents:
      - params_nn
      - params_umap
      - params_tsne
      - params_phate
      - params_pacmap
      - params_swiss_role
      - params_clusters
      - params_hierarchical
      - params_trajectory
  - title: "Rust wrappers"
    desc: "Everything rusty - only use this if you know what you are doing..."
    contents:
      - rs_approx_nearest_neighbours
      - rs_data_clusters
      - rs_data_swiss_role
      - rs_data_trajectory
      - rs_data_hierarchical
      - rs_phate
      - rs_phate_from_knn
      - rs_tsne
      - rs_tsne_from_knn
      - rs_umap
      - rs_umap_from_knn
      - rs_pacmap
      - rs_pacmap_from_knn
      - rs_check_cluster_separation
