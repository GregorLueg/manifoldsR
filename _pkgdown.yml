url: https://gregorlueg.github.io/manifoldsR/
template:
  bootstrap: 5
  bootswatch: solar
  bslib:
    primary: "#268bd2"
    border-radius: 0.4rem
    btn-border-radius: 0.4rem
  includes:
    in_header: ""
  css: pkgdown/extra.css
home:
  title: "manifoldsR"
  description: "Fast(!) manifold embedding learning methods powered by Rust"
navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/GregorLueg/manifoldsR
      aria-label: GitHub

articles:
  - title: "Vignettes"
    navbar: ~
    contents:
      - knn_searches
      - umap
      - tsne
      - phate
      - pacmap
      - diffusion_map
      - clustering

reference:
  - title: "2D embedding methods"
    desc: "The core functions to generate the 2D embeddings"
    contents:
      - tsne
      - umap
      - phate
      - pacmap
      - diffusion_maps
  - title: "kNN helpers"
    desc: "Everything and anything around kNN graph generation"
    contents:
      - generate_knn_graph
      - new_nearest_neighbour
      - get_idx_mat
      - get_idx_flat
      - get_dist_mat
      - get_dist_flat
  - title: "Synthetic data"
    contents:
      - manifold_synthetic_data
  - title: "Clustering algorithms"
    desc: "Various methods to do clustering in manifoldsR"
    contents:
      - best_membership
      - calc_ari
      - calc_inertia
      - calc_silhouette_score
      - evoc
      - get_centroids
      - get_layer
      - get_nearest_neighbours
      - kmeans_cluster
      - membership
  - title: "Params"
    desc: "Wrapper functions around core parameters"
    contents:
      - params_clusters
      - params_evoc
      - params_hierarchical
      - params_kmeans
      - params_nn
      - params_pacmap
      - params_diffusion_maps
      - params_phate
      - params_umap
      - params_swiss_role
      - params_swiss_role_biased
      - params_trajectory
      - params_tsne
  - title: "Rust wrappers"
    desc: "Everything rusty - only use this if you know what you are doing..."
    contents:
      - rs_approx_nearest_neighbours
      - rs_ari
      - rs_check_cluster_separation
      - rs_data_biased_swiss_role
      - rs_data_clusters
      - rs_data_swiss_role
      - rs_data_trajectory
      - rs_data_hierarchical
      - rs_diffusion_maps
      - rs_diffusion_maps_from_knn
      - rs_evoc
      - rs_evoc_from_knn
      - rs_intertia
      - rs_k_means
      - rs_k_means_mini_batch
      - rs_pacmap
      - rs_pacmap_from_knn
      - rs_phate
      - rs_phate_from_knn
      - rs_silhouette_score
      - rs_tsne
      - rs_tsne_from_knn
      - rs_umap
      - rs_umap_from_knn
