[package]
name = 'manifoldsr'
publish = false
version = '0.2.3'
edition = '2021'
rust-version = '1.85'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'manifoldsR'

[dependencies]
ann-search-rs = "0.4.1"
bixverse-rs = "0.3.0"
extendr-api = "0.9.0"
evoc-rs = "0.2.1"
faer = "0.23.2"
faer-entity = "0.20.1"
num-traits = "0.2.19"
rand = "0.10.0"
rayon = "1.11.0"
rustc-hash = "2.1.2"
[target.'cfg(not(windows))'.dependencies]
manifolds-rs = { git = "https://github.com/GregorLueg/manifolds-rs.git", branch = "feat-numeric-stability", features = [ "fft_tsne" ] }
[target.'cfg(windows)'.dependencies]
manifolds-rs = { git = "https://github.com/GregorLueg/manifolds-rs.git", branch = "feat-numeric-stability" }


[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[lints.rust]
non_snake_case = "allow"

[[bin]]
name = "document"
path = "document.rs"
