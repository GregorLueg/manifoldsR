[package]
name = 'manifoldsr'
publish = false
version = '0.6.0'
edition = '2021'
rust-version = '1.90'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'manifoldsR'

[dependencies]
ann-search-rs = "0.12.1"
bixverse-r = { version = "0.10.0", default-features = false }
extendr-api = "0.9.0"
evoc-rs = "0.6.0"
faer = "0.24.4"
faer-entity = "0.20.1"
num-traits = "0.2.19"
rand = "0.10.0"
rayon = "1.11.0"
rustc-hash = "2.1.2"
rand_distr = "0.5.1"
manifolds-rs = { version = "0.9.0", features = ["fft_tsne"] }

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[lints.rust]
non_snake_case = "allow"

[[bin]]
name = "document"
path = "document.rs"

[patch.crates-io]
manifolds-rs = { git = "https://github.com/GregorLueg/manifolds-rs", rev = "572af534e92ee9c8022beba01457d9ea732f337a" }
bixverse-r  = { git = "https://github.com/GregorLueg/bixverse-rs", rev = "4aed8e96e49a052be256a68d2dd2b210480bb38b" }
evoc-rs = { git = "https://github.com/GregorLueg/evoc-rs", rev = "8067794fb5b2683d3664b2151f7ab16acf6e100a" }
