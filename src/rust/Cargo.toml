[package]
name = 'manifoldsr'
publish = false
version = '0.3.0'
edition = '2021'
rust-version = '1.90'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'manifoldsR'

[dependencies]
ann-search-rs = "0.5.2"
bixverse-rs = "0.4.5"
extendr-api = "0.9.0"
evoc-rs = "0.2.7"
faer = "0.23.2"
faer-entity = "0.20.1"
num-traits = "0.2.19"
rand = "0.10.0"
rayon = "1.11.0"
rustc-hash = "2.1.2"
rand_distr = "0.5.1"
[target.'cfg(not(windows))'.dependencies]
manifolds-rs = { version = "0.3.15", features = [ "fft_tsne" ] }
[target.'cfg(windows)'.dependencies]
manifolds-rs = { version = "0.3.15" }

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[lints.rust]
non_snake_case = "allow"

[[bin]]
name = "document"
path = "document.rs"
