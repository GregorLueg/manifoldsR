[package]
name = 'manifoldsr'
publish = false
version = '0.3.8'
edition = '2021'
rust-version = '1.90'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'manifoldsR'

[dependencies]
ann-search-rs = "0.11.0"
bixverse-rs = { version = "0.7.0", features = ["r"] }
extendr-api = "0.9.0"
evoc-rs = "0.5.0"
faer = "0.24.4"
faer-entity = "0.20.1"
num-traits = "0.2.19"
rand = "0.10.0"
rayon = "1.11.0"
rustc-hash = "2.1.2"
rand_distr = "0.5.1"
manifolds-rs = { version = "0.7.0", features = ["fft_tsne"] }

[patch.crates-io]
bixverse-rs = { git = "https://github.com/GregorLueg/bixverse-rs", branch = "release-0.7.0" }
manifolds-rs = { git = "https://github.com/GregorLueg/manifolds-rs", branch = "feat-dreams" }

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[lints.rust]
non_snake_case = "allow"

[[bin]]
name = "document"
path = "document.rs"
